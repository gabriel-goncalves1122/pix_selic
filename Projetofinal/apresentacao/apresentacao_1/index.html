<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pix × Custo Brasil — Projeto Final ECOX14</title>
  <link rel="stylesheet" href="../vendor/reveal.js/dist/reset.css">
  <link rel="stylesheet" href="../vendor/reveal.js/dist/reveal.css">
  <link rel="stylesheet" href="../vendor/reveal.js/dist/theme/white.css">
  <link rel="stylesheet" href="../css/custom.css">
</head>
<body>
<div class="reveal">
  <div class="slides" id="slides-container">
    <!-- Slides modulares carregados dinamicamente via Live Server -->
  </div>
</div>

<script src="../vendor/reveal.js/dist/reveal.js"></script>
<script src="../vendor/reveal.js/plugin/notes/notes.js"></script>
<script src="../vendor/chart.umd.min.js"></script>
<script src="data/metricas.js"></script>
<script src="js/graficos.js"></script>
<script>
  (async function () {
    const SLIDES = [
      'slides/01_capa.html',
      'slides/02_ideia_central.html',
      'slides/03_arquitetura.html',
      'slides/04_problemas_bronze.html',
      'slides/05_tabela_depara.html',
      'slides/06_metricas_parquet.html',
      'slides/07_resultados_nativos.html',
      'slides/08_macro_selic.html',
      'slides/09_roadmap_ouro.html'
    ];

    const container = document.getElementById('slides-container');

    try {
      const responses = await Promise.all(SLIDES.map(url => fetch(url)));
      const texts = await Promise.all(responses.map(res => {
        if (!res.ok) throw new Error(`Falha ao carregar ${res.url} (status ${res.status})`);
        return res.text();
      }));

      texts.forEach(html => container.insertAdjacentHTML('beforeend', html));

      await Reveal.initialize({
        hash: true,
        slideNumber: 'c/t',
        width: 1280,
        height: 720,
        margin: 0.05,
        transition: 'fade',
        plugins: [RevealNotes]
      });

      if (window.iniciarGraficos) {
        window.iniciarGraficos();
      }
    } catch (err) {
      console.error(err);
      container.innerHTML = `
        <section style="text-align: left; padding: 2em;">
          <h2 style="color: #b91c1c;">Aviso de Carregamento</h2>
          <p style="font-size: 0.8em; color: #334155;">
            Os slides são modulares e carregados dinamicamente a partir da pasta <code>slides/</code>.
          </p>
          <div style="background: #fee2e2; border-left: 4px solid #b91c1c; padding: 1em; border-radius: .4em; font-size: 0.7em; color: #991b1b; margin-top: 1em;">
            <b>Detectado bloqueio de segurança local (CORS):</b><br>
            Se você deu duplo clique no arquivo <code>index.html</code> (protocolo <code>file://</code>), o navegador impede o carregamento de arquivos locais por segurança.<br><br>
            <b>Como resolver:</b><br>
            Abra a pasta no VS Code e clique em <b>"Go Live" (Live Server)</b>, ou execute no terminal:<br>
            <code>py -m http.server 8000</code> e acesse <code>http://localhost:8000/Projetofinal/apresentacao/</code>.
          </div>
        </section>
      `;
      Reveal.initialize({
        hash: true,
        width: 1280,
        height: 720
      });
    }
  })();
</script>
</body>
</html>
